[project]
name = "minilms-g6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nam081105", email = "nampham.081105@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=4.0",
    "flask>=3.0,<4",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
minilms-g6 = "minilms_g6:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
