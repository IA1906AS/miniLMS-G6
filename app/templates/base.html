<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MiniLMS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  <main class="auth-shell">
    <section class="intro-panel">
      <div class="brand"><span class="brand-mark">M</span> MiniLMS</div>
      <div class="intro-copy">
        <p class="eyebrow">Nền tảng học tập</p>
        <h1>Học đúng nhịp.<br><em>Tiến bộ mỗi ngày.</em></h1>
        <p>Quản lý khóa học, điểm số và hành trình học tập của bạn trong một không gian tập trung.</p>
      </div>
      <div class="intro-foot">© 2026 MiniLMS</div>
    </section>
    <section class="form-panel">{% block form_content %}{% endblock %}</section>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
