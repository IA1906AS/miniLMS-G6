name: Semgrep SAST Scan

# Kích hoạt quét khi có Push hoặc Pull Request vào nhánh chính (main/master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Cho phép kích hoạt quét thủ công từ giao diện GitHub
  workflow_dispatch: 

jobs:
  semgrep-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    # Khai báo quyền cần thiết để tải code và đẩy kết quả lên mục Security của GitHub
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      # Bước 1: Checkout mã nguồn của dự án
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Chạy Semgrep OSS Scan
      - name: Run Semgrep OSS
        run: |
          pip install semgrep
          semgrep scan --config="p/default" --sarif --output=semgrep-results.sarif

      # Bước 3: Đẩy kết quả quét lên tab Security/Code Scanning của GitHub
      - name: Upload SARIF file to GitHub Security Tabs
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always() # Luôn chạy bước này ngay cả khi phát hiện lỗi bảo mật ở bước trước
